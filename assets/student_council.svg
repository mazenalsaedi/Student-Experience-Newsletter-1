<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-council" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow-slc" x="-10%" y="-10%" width="120%" height="120%">
      <dropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-council)"/>

  <!-- Decorative Stars -->
  <g fill="#a5b4fc" opacity="0.15">
    <circle cx="80" cy="70" r="40"/>
    <circle cx="720" cy="380" r="60"/>
    <circle cx="700" cy="80" r="30"/>
  </g>

  <!-- Title Banner -->
  <text x="400" y="55" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">STUDENT LEADERSHIP COUNCIL</text>
  <text x="400" y="82" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#c7d2fe" text-anchor="middle">Our Student Voices • Whole-School Assembly Introduction &amp; Elections</text>

  <!-- Executive Officers Card -->
  <g transform="translate(60, 110)" filter="url(#shadow-slc)">
    <rect width="320" height="250" rx="16" fill="#ffffff" opacity="0.97"/>
    <!-- Header Badge -->
    <rect x="20" y="20" width="280" height="34" rx="8" fill="#4338ca"/>
    <text x="160" y="42" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">EXECUTIVE OFFICERS</text>

    <!-- President -->
    <circle cx="45" cy="95" r="18" fill="#e0e7ff"/>
    <text x="45" y="101" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#4338ca" text-anchor="middle">👑</text>
    <text x="75" y="93" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#1e1b4b">Zara Lawaki</text>
    <text x="75" y="110" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#6366f1">Council President</text>

    <line x1="30" y1="130" x2="290" y2="130" stroke="#e0e7ff" stroke-width="1.5"/>

    <!-- Vice President -->
    <circle cx="45" cy="175" r="18" fill="#fef3c7"/>
    <text x="45" y="181" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#d97706" text-anchor="middle">⭐</text>
    <text x="75" y="173" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#1e1b4b">Methuni Muthambi</text>
    <text x="75" y="190" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#d97706">Vice President</text>

    <!-- Bi-Weekly Meetings Note -->
    <rect x="20" y="210" width="280" height="24" rx="12" fill="#f1f5f9"/>
    <text x="160" y="226" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#475569" text-anchor="middle">🗓️ Meets every 2 weeks to share student ideas</text>
  </g>

  <!-- Grade Class Leaders Card -->
  <g transform="translate(420, 110)" filter="url(#shadow-slc)">
    <rect width="320" height="250" rx="16" fill="#ffffff" opacity="0.97"/>
    <!-- Header Badge -->
    <rect x="20" y="20" width="280" height="34" rx="8" fill="#0284c7"/>
    <text x="160" y="42" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">GRADE CLASS LEADERS</text>

    <!-- Mini grid of grade leaders -->
    <g font-family="'Inter', sans-serif" font-size="12" fill="#1e293b">
      <text x="30" y="82"><strong>Grade 6:</strong> Talha Orkaz</text>
      <text x="30" y="108"><strong>Grade 5:</strong> Evangelia Tsikna</text>
      <text x="30" y="134"><strong>Grade 4:</strong> Andrea Steven</text>
      <text x="30" y="160"><strong>Grade 3:</strong> Eliàs Mira</text>
      <text x="30" y="186"><strong>Grade 2:</strong> Kieran Dieckmann</text>
      <text x="30" y="212"><strong>Grade 1:</strong> Moaz Ahmed</text>
    </g>
  </g>

  <!-- Bottom Badge -->
  <rect x="200" y="380" width="400" height="40" rx="20" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="400" y="405" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">🗳️ "Empowering Student Voice &amp; Civic Responsibility"</text>
</svg>
