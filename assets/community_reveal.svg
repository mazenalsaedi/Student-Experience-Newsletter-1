<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-community" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="grad-stars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grad-dunes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="grad-pearls" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-corals" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-community)"/>

  <!-- Stage Lights & Confetti overlay -->
  <circle cx="150" cy="50" r="180" fill="#fbbf24" opacity="0.08"/>
  <circle cx="650" cy="50" r="180" fill="#fb7185" opacity="0.08"/>
  
  <text x="400" y="55" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">OUR FOUR SCHOOL COMMUNITIES</text>
  <text x="400" y="82" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#9ca3af" text-anchor="middle">Whole-School Community Reveal Assembly</text>

  <!-- 4 Community Cards -->
  <!-- 1. STARS -->
  <g transform="translate(60, 110)" filter="url(#glow)">
    <rect width="150" height="240" rx="16" fill="url(#grad-stars)"/>
    <circle cx="75" cy="70" r="35" fill="#ffffff" opacity="0.25"/>
    <text x="75" y="80" font-size="36" text-anchor="middle">⭐</text>
    <text x="75" y="135" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">STARS</text>
    <rect x="20" y="155" width="110" height="2" fill="#ffffff" opacity="0.4"/>
    <text x="75" y="180" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Excellence &amp;</text>
    <text x="75" y="196" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Brilliance</text>
  </g>

  <!-- 2. DUNES -->
  <g transform="translate(235, 110)" filter="url(#glow)">
    <rect width="150" height="240" rx="16" fill="url(#grad-dunes)"/>
    <circle cx="75" cy="70" r="35" fill="#ffffff" opacity="0.25"/>
    <text x="75" y="80" font-size="36" text-anchor="middle">🏜️</text>
    <text x="75" y="135" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">DUNES</text>
    <rect x="20" y="155" width="110" height="2" fill="#ffffff" opacity="0.4"/>
    <text x="75" y="180" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Resilience &amp;</text>
    <text x="75" y="196" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Strength</text>
  </g>

  <!-- 3. PEARLS -->
  <g transform="translate(410, 110)" filter="url(#glow)">
    <rect width="150" height="240" rx="16" fill="url(#grad-pearls)"/>
    <circle cx="75" cy="70" r="35" fill="#ffffff" opacity="0.25"/>
    <text x="75" y="80" font-size="36" text-anchor="middle">🦪</text>
    <text x="75" y="135" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">PEARLS</text>
    <rect x="20" y="155" width="110" height="2" fill="#ffffff" opacity="0.4"/>
    <text x="75" y="180" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Wisdom &amp;</text>
    <text x="75" y="196" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Integrity</text>
  </g>

  <!-- 4. CORALS -->
  <g transform="translate(585, 110)" filter="url(#glow)">
    <rect width="150" height="240" rx="16" fill="url(#grad-corals)"/>
    <circle cx="75" cy="70" r="35" fill="#ffffff" opacity="0.25"/>
    <text x="75" y="80" font-size="36" text-anchor="middle">🪸</text>
    <text x="75" y="135" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">CORALS</text>
    <rect x="20" y="155" width="110" height="2" fill="#ffffff" opacity="0.4"/>
    <text x="75" y="180" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Community &amp;</text>
    <text x="75" y="196" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Unity</text>
  </g>

  <!-- Footer Banner -->
  <rect x="150" y="380" width="500" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="400" y="405" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#f3f4f6" text-anchor="middle">🎉 "Belonging, Teamwork &amp; Pride Across All Grades &amp; Staff"</text>
</svg>
