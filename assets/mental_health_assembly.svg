<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mental" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="quote-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow-mh" x="-10%" y="-10%" width="120%" height="120%">
      <dropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-mental)"/>
  
  <!-- Subtle Background Rings -->
  <circle cx="700" cy="100" r="200" fill="#99f6e4" opacity="0.1"/>
  <circle cx="100" cy="350" r="180" fill="#2dd4bf" opacity="0.1"/>

  <!-- Main Stage Card -->
  <rect x="60" y="40" width="680" height="370" rx="24" fill="url(#quote-card)" filter="url(#shadow-mh)"/>

  <!-- Speaker Badge Header -->
  <rect x="90" y="70" width="340" height="36" rx="18" fill="#ccfbf1"/>
  <text x="110" y="93" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#0f766e">🧠 INTERNATIONAL MENTAL HEALTH DAY</text>

  <!-- Guest Speaker Title -->
  <text x="90" y="145" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="28" fill="#0f2942">Dr. Maram Alsamman</text>
  <text x="90" y="172" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#0d9488">Guest Speaker • Student &amp; Staff Wellbeing Assembly</text>

  <!-- Featured Quote Bubble -->
  <rect x="90" y="200" width="620" height="130" rx="16" fill="#f8fafc" stroke="#5eead4" stroke-width="2"/>
  <text x="120" y="240" font-family="'Playfair Display', serif" font-style="italic" font-weight="700" font-size="20" fill="#0f2942">"It is healthy to talk about how we feel, and support is always available."</text>
  <text x="120" y="275" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#475569">Reinforcing mental health awareness, emotional resilience, and open communication.</text>
  
  <!-- Interactive Pill Tags -->
  <rect x="90" y="348" width="140" height="32" rx="16" fill="#0f766e"/>
  <text x="160" y="369" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">💚 Self-Care</text>

  <rect x="245" y="348" width="160" height="32" rx="16" fill="#0284c7"/>
  <text x="325" y="369" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">💬 Open Dialogue</text>

  <rect x="420" y="348" width="150" height="32" rx="16" fill="#d97706"/>
  <text x="495" y="369" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">🤝 Support System</text>
</svg>
